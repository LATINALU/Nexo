    📝 Texto: "[Texto grande en pantalla]"
    🎵 Audio: [Música trending/voz]

    [1-15s] DESARROLLO
    🎬 Visual: [Descripción con cortes rápidos]
    🎤 Voz: "[Texto si aplica]"
    📝 Texto: "[Subtítulos/énfasis]"

    [15-30s] CLÍMAX
